name: Feature request
description: An idea to make Edgewatch more useful (not a new check).
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Sketches and screenshots welcome.
  - type: textarea
    id: else
    attributes:
      label: Alternatives you've tried
