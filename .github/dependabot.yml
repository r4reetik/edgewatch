version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["react", "react-dom", "@types/react*", "@cloudflare/kumo", "@phosphor-icons/*", "echarts", "vite", "@vitejs/*", "tailwindcss", "@tailwindcss/*"]
      tooling:
        patterns: ["typescript", "@biomejs/*", "@types/node"]
      server:
        patterns: ["hono", "@hono/*"]
    ignore:
      # Types match the Node.js line Edgewatch targets (24 LTS); move both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The image stays on Node 24 LTS until the project moves to a new Node line.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
