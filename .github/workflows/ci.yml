name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags, so the tests can compare CHANGELOG.md with what each release shipped
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-test the packed CLI
        run: |
          npm pack
          npm install -g ./keelson-*.tgz
          keelson --version
          (keelson --no-open --port 4999 --data-dir "$RUNNER_TEMP/ew" &) && sleep 3
          curl -fsS http://127.0.0.1:4999/api/health
          curl -fsS http://127.0.0.1:4999/ | grep -q Keelson

  # The oldest Node.js that runs Keelson is 26.13.0 (MIN_NODE in src/node-check.ts): build it, then run it on
  # exactly that, and check that an older one is refused with upgrade steps.
  minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Smoke-test the packed CLI on Node 26.13.0
        run: |
          npm install -g ./keelson-*.tgz
          keelson --version
          (keelson --no-open --port 4998 --data-dir "$RUNNER_TEMP/ew" &) && sleep 3
          curl -fsS http://127.0.0.1:4998/api/health
          curl -fsS http://127.0.0.1:4998/ | grep -q Keelson
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: An older Node.js installs this version and gets upgrade steps
        run: |
          npm install -g ./keelson-*.tgz
          if keelson --version > out.txt 2>&1; then cat out.txt; echo "expected Node 24 to be refused"; exit 1; fi
          cat out.txt
          grep -q "npx keelson@latest" out.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: keelson:ci
      - name: Smoke-test the container
        run: |
          docker run -d --name ew -p 4318:4317 -e KEELSON_AUTH=none keelson:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4318/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:4318/api/health
          docker logs ew
      - name: A container set up under the old name still starts
        # Compose files from before the rename to Keelson set EDGEWATCH_* variables (AGENTS.md: old names keep working).
        run: |
          docker run -d --name old -p 4319:5000 -e EDGEWATCH_AUTH=none -e EDGEWATCH_PORT=5000 keelson:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4319/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:4319/api/health
          docker logs old
