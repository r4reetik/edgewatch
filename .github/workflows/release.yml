name: Release

# Publishes a release when its tag (vX.Y.Z) is pushed. Releases are cut on the
# maintainer's machine with `npm run release -- <patch|minor|major|rc>` (see
# docs/releasing.md), which commits "Release vX.Y.Z" and pushes main and the tag
# together. This workflow never commits: when it did, every release forked
# origin/main from the maintainer's local main.
#
# Keelson ships only as a container image on GHCR (nothing is published to npm).
# Stable releases are tagged :X.Y.Z, :X.Y (the release line), :X from 1.0, and
# :latest. Each also goes out as ghcr.io/<owner>/edgewatch, the old name, so
# Docker installations from before the rename to Keelson keep upgrading.
# Release candidates (X.Y.Z-rc.N) get :X.Y.Z-rc.N only, so nobody receives one
# without asking.
#
# Every publishing step skips what's already done, so re-running a release that
# failed halfway finishes it instead of failing on "version already exists".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      stable_major: ${{ steps.meta.outputs.stable_major }}
      released: ${{ steps.meta.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # main and the tags, for the checks below
      - name: The tag is on main
        # Releases come from main only; a tag on another branch would publish code main doesn't have.
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME isn't on main. Release with npm run release, from main."; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # No dependency cache in the release: a cache written by another workflow can't reach what gets published.
      - run: npm ci
      - run: npm run check
      - id: meta
        name: The tag matches package.json and has release notes
        run: |
          tag="$GITHUB_REF_NAME"
          version="$(node -p 'require("./package.json").version')"
          test "$tag" = "v$version" || { echo "Tag $tag doesn't match package.json $version"; exit 1; }
          node scripts/release.ts notes "$version" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Already fully released (a duplicate run): nothing left to do.
          if gh release view "$tag" > /dev/null 2>&1; then echo "released=true" >> "$GITHUB_OUTPUT"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          case "$version" in 0.*|*-*) echo "stable_major=false" >> "$GITHUB_OUTPUT";; *) echo "stable_major=true" >> "$GITHUB_OUTPUT";; esac
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.released != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Also under the old name, which Docker installations from before the rename pull.
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository_owner }}/edgewatch
          # Prereleases only get their exact version; {{major}}.{{minor}} is never generated for them.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.stable_major == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
          flavor: latest=false
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github:
    needs: [verify, docker]
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/release.ts notes "$VERSION" > notes.md
          printf '\n---\n\n**Install:** `docker pull ghcr.io/%s:%s`. Upgrading? See [docs/upgrading.md](https://github.com/%s/blob/main/docs/upgrading.md).\n' \
            "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_REPOSITORY" >> notes.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
      - run: gh release create "$TAG" --title "Keelson $TAG" --notes-file notes.md --verify-tag $([ "$PRERELEASE" = true ] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
